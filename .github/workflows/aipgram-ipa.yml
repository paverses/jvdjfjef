name: AIPGram IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | head -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Apply AIPGram configuration
        run: node aipgram/apply.js

      - name: Install the self-signed signing identity
        run: |
          KEYCHAIN=aipgram.keychain
          security create-keychain -p secret "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p secret "$KEYCHAIN"
          # the .p12 already carries Public.cer; importing it again fails with "already exists"
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/security
          security import build-system/AppleWWDRCAG3.cer -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security || true
          security set-key-partition-list -S apple-tool:,apple: -k secret "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" || true

      - uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ github.run_id }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=aipgram/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p artifacts
          IPA=$(ls bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa | head -1)
          cp "$IPA" artifacts/AIPGram.ipa
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: aipgram-ios-ipa
          path: artifacts/AIPGram.ipa
          if-no-files-found: error
